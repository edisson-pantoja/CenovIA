[build]
builder = "NIXPACKS"

[build.env]
NODE_VERSION = "22"

[deploy]
startCommand = "npm install --legacy-peer-deps && npm run build --workspace=packages/backend && node packages/backend/dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
